[project]
name = "secrets-vault-tui"
version = "0.17.2"
description = "Central TUI secrets registry: edit once, push everywhere over SSH"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leland Green" }]
keywords = ["secrets", "vault", "tui", "ssh", "dotenv", "age", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
    "tomlkit>=0.12",
    "pyperclip>=1.9",
    "pyrage>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/lelandg/secrets-vault"
Repository = "https://github.com/lelandg/secrets-vault"
Changelog = "https://github.com/lelandg/secrets-vault/blob/main/CHANGELOG.md"
Issues = "https://github.com/lelandg/secrets-vault/issues"

[project.scripts]
sv = "secrets_vault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires `ssh localhost` to work non-interactively"]
